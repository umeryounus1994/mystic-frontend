<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple" [fullScreen]="true">
    <p style="font-size: 30px; color: white">{{ 'COMMON.FETCHING_DATA' | translate }}</p>
</ngx-spinner>
<div class="row mb-3">
    <div class="col-12 d-sm-flex justify-content-between align-items-center">
        <div>
            <button class="btn btn-light btn-sm me-3" (click)="router.navigate(['management/list-exploring-spots'])">
                <i class="bi bi-arrow-left me-2"></i>{{ 'COMMON.BACK' | translate }}
            </button>
            <h1 class="h3 mb-0 d-inline">{{ 'EXPLORING_SPOTS.EDIT' | translate }}</h1>
        </div>
    </div>
</div>
<div class="card shadow">
    <div class="card-body">
        <form class="row g-4" [formGroup]="spotForm" *ngIf="spotForm" (ngSubmit)="onSubmit()">
            <div class="col-lg-4">
                <label class="form-label">{{ 'EXPLORING_SPOTS.SPOT_NAME' | translate }}</label>
                <input type="text" class="form-control" formControlName="spot_name"
                    [ngClass]="{ 'is-invalid': submitted && f['spot_name'].errors }">
            </div>
            <div class="col-lg-4">
                <label class="form-label">{{ 'EXPLORING_SPOTS.CITY' | translate }}</label>
                <input type="text" class="form-control" formControlName="city"
                    [ngClass]="{ 'is-invalid': submitted && f['city'].errors }">
            </div>
            <div class="col-lg-4">
                <label class="form-label">{{ 'EXPLORING_SPOTS.POINTS' | translate }}</label>
                <input type="number" class="form-control" formControlName="no_of_points" min="1">
            </div>
            <div class="col-lg-12">
                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate }}</label>
                <textarea class="form-control" rows="3" formControlName="description"></textarea>
            </div>
            <div class="col-lg-4">
                <label class="form-label">{{ 'FORMS.LATITUDE' | translate }}</label>
                <input type="number" step="any" class="form-control" formControlName="latitude"
                    [ngClass]="{ 'is-invalid': submitted && f['latitude'].errors }">
            </div>
            <div class="col-lg-4">
                <label class="form-label">{{ 'FORMS.LONGITUDE' | translate }}</label>
                <input type="number" step="any" class="form-control" formControlName="longitude"
                    [ngClass]="{ 'is-invalid': submitted && f['longitude'].errors }">
            </div>
            <div class="col-lg-4">
                <label class="form-label">{{ 'EXPLORING_SPOTS.RADIUS_METERS' | translate }}</label>
                <input type="number" class="form-control" formControlName="radius_meters" min="10">
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_ar" formControlName="is_ar">
                    <label class="form-check-label" for="is_ar">{{ 'EXPLORING_SPOTS.AR_OPTIONAL' | translate }}</label>
                </div>
                <small class="text-muted">{{ 'EXPLORING_SPOTS.AR_HINT' | translate }}</small>
            </div>
            <div class="col-12 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">{{ 'COMMON.UPDATE' | translate }}</button>
            </div>
        </form>
    </div>
</div>
